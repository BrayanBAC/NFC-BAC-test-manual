<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasar asistencia</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#ddd;--ok:#2e7d32;--ko:#c62828;--ju:#ef6c00}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#aaa;--line:#333}}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--fg);margin:auto;padding:12px;max-width:620px}
h1{font-size:20px}input,button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1;min-width:110px}
.al{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.al .n{flex:2}.al small{color:var(--mut)}.b{flex:0 0 auto;padding:6px 9px}
.A{background:var(--ok);color:#fff}.F{background:var(--ko);color:#fff}.J{background:var(--ju);color:#fff}
.mut{color:var(--mut);font-size:13px}
</style></head><body>
<h1>Pasar asistencia</h1>
<div class="row">
  <input id="id" placeholder="Código de clase (ej. 14150)" inputmode="numeric">
  <input id="nivel" placeholder="Nivel (A1, A2…)">
  <input id="clave" type="password" placeholder="Clave">
</div>
<button onclick="cargar()" style="width:100%">Cargar lista</button>
<p id="msg" class="mut"></p>
<div id="lista"></div>
<script>
const API = "https://script.google.com/a/macros/barcelonactua.org/s/AKfycbz2-mnYZhvvyMs6lDZGxtT7GwGM0N-FYVAKVTr4HZ4ddhI2IZwTK3YlUA328yWvI1Wh/exec";
const $ = i => document.getElementById(i);
let lista = [];
$("clave").value = localStorage.getItem("clave") || "";
const msg = t => $("msg").textContent = t;
async function cargar(){
  localStorage.setItem("clave", $("clave").value);
  msg("Cargando…");
  try{
    const q = new URLSearchParams({id:$("id").value.trim(), nivel:$("nivel").value.trim(), clave:$("clave").value});
    const r = await (await fetch(API + "?" + q)).json();
    if(r.error) return msg(r.error);
    lista = r.alumnos; msg(lista.length ? "" : "No hay alumnos con ese código y nivel."); draw();
  }catch(e){ msg("No se pudo conectar. Revisa la URL y la conexión."); }
}
async function marcar(i, v){
  const a = lista[i], nuevo = a.asistencia === v ? "" : v;
  msg("Guardando…");
  try{
    const r = await (await fetch(API, {method:"POST", body: JSON.stringify(
      {id:$("id").value.trim(), row:a.row, valor:nuevo, clave:$("clave").value})})).json();
    if(r.error) return msg(r.error);
    a.asistencia = nuevo; msg(""); draw();
  }catch(e){ msg("No se guardó. Inténtalo otra vez."); }
}
function draw(){
  $("lista").innerHTML = lista.map((a,i) =>
    `<div class="al"><div class="n"></div>` +
    [["ASISTE","A","Asiste"],["FALTA","F","Falta"],["JUSTIFICADA","J","Justif."]].map(([v,c,t]) =>
      `<button class="b ${a.asistencia===v?c:""}" onclick="marcar(${i},'${v}')">${t}</button>`).join("") + `</div>`).join("");
  document.querySelectorAll(".n").forEach((el,i) => {
    el.textContent = lista[i].nombre;
    if(lista[i].cate==="V"){ const s=document.createElement("small"); s.textContent=" (voluntario)"; el.appendChild(s); }
  });
}
</script></body></html>
