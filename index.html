## ALARMA PARA AVISAR DE LOS PROCESOS EN CRM, QUE ESTAN APUNTO DE CADUCAR##

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Checklist de turno · Bacstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20281f;
    --forest:#243f37;
    --forest-deep:#182e28;
    --paper:#eef0e8;
    --paper-dim:#e2e5da;
    --ochre:#c9903c;
    --ochre-dim:#e7c793;
    --clay:#a5624c;
    --line: rgba(32,40,31,0.14);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding: 24px 16px 64px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width:480px; }

  /* --- Tag de llavero (elemento firma) --- */
  .tag{
    background: var(--forest);
    color: var(--paper);
    border-radius: 22px;
    padding: 22px 22px 20px;
    position:relative;
    box-shadow: 0 10px 30px rgba(24,46,40,0.25);
    overflow:hidden;
  }
  .tag::after{
    content:"";
    position:absolute;
    top:16px; right:16px;
    width:26px; height:26px;
    border-radius:50%;
    background: var(--paper);
    box-shadow: inset 0 0 0 4px var(--forest), inset 0 0 0 5px rgba(238,240,232,0.4);
  }
  .tag .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--ochre-dim);
    margin:0 0 6px;
  }
  .tag h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 30px;
    line-height:1.05;
    margin:0 0 4px;
    max-width: 80%;
  }
  .tag .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color: rgba(238,240,232,0.75);
    margin-top: 10px;
  }

  /* --- Selector de casa (si no viene por URL) --- */
  .house-picker{
    margin-top:16px;
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:8px;
  }
  .house-picker button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 6px;
    border-radius:12px;
    border:1px solid var(--line);
    background: white;
    color: var(--ink);
    cursor:pointer;
  }
  .house-picker button.active{
    background: var(--forest);
    color: var(--paper);
    border-color: var(--forest);
  }

  /* --- Selector Apertura / Cierre --- */
  .turno-toggle{
    display:flex;
    margin: 22px 0 6px;
    background: var(--paper-dim);
    border-radius: 14px;
    padding:4px;
    gap:4px;
  }
  .turno-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    color: var(--ink);
    border-radius: 10px;
    cursor:pointer;
    opacity:0.55;
  }
  .turno-toggle button.active{
    background: white;
    opacity:1;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  /* --- Lista de tareas --- */
  .list{ margin-top: 14px; display:flex; flex-direction:column; gap:8px; }
  .item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 14px;
    cursor:pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .item.done{
    background: rgba(201,144,60,0.08);
    border-color: var(--ochre-dim);
  }
  .checkbox{
    flex:none;
    width:22px; height:22px;
    border-radius:7px;
    border:2px solid var(--forest);
    margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.15s ease;
  }
  .item.done .checkbox{ background: var(--ochre); border-color:var(--ochre); }
  .checkbox svg{ width:13px; height:13px; opacity:0; transition:opacity .12s ease; }
  .item.done .checkbox svg{ opacity:1; }
  .item-text{ font-size:15px; line-height:1.35; }
  .item.done .item-text{ text-decoration: line-through; opacity:0.6; }

  /* --- Progreso --- */
  .progress-row{
    display:flex; align-items:center; gap:10px;
    margin: 18px 0 4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color: rgba(32,40,31,0.65);
  }
  .progress-track{
    flex:1; height:6px; border-radius:4px; background: var(--paper-dim); overflow:hidden;
  }
  .progress-fill{ height:100%; background: var(--ochre); width:0%; transition: width .25s ease; }

  /* --- Firma / nombre --- */
  .signature{ margin-top:20px; }
  .signature label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color: rgba(32,40,31,0.55);
    margin-bottom:6px;
  }
  .signature input{
    width:100%;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    background:white;
  }

  .save-btn{
    width:100%;
    margin-top:16px;
    padding:15px;
    border:none;
    border-radius:14px;
    background: var(--forest);
    color: var(--paper);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .save-btn:disabled{ opacity:0.4; }
  .save-btn.saved{ background: var(--ochre); color: var(--forest-deep); }

  /* --- Historial --- */
  .history{ margin-top: 30px; }
  .history h2{
    font-family:'Fraunces', serif;
    font-size:18px;
    margin:0 0 10px;
  }
  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 14px;
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:7px;
    font-size:13px;
  }
  .history-item .h-left{ display:flex; flex-direction:column; gap:2px; }
  .history-item .h-turno{ font-weight:600; }
  .history-item .h-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: rgba(32,40,31,0.55); }
  .history-item .h-pct{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    background: var(--paper-dim);
    font-size:12px;
  }
  .empty-note{
    font-size:13px;
    color: rgba(32,40,31,0.5);
    padding: 10px 2px;
  }
  .export-btn{
    margin-top:10px;
    width:100%;
    padding:11px;
    border-radius:12px;
    border:1px solid var(--line);
    background:white;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color: var(--ink);
    cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="tag">
    <p class="eyebrow">BarcelonActua · Bacstation</p>
    <h1 id="houseTitle">Casa</h1>
    <p class="meta" id="dateLine">—</p>
    <div class="house-picker" id="housePicker"></div>
  </div>

  <div class="turno-toggle" id="turnoToggle">
    <button data-turno="apertura">Apertura</button>
    <button data-turno="cierre">Cierre</button>
  </div>

  <div class="progress-row">
    <span id="progressLabel">0/0</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="list" id="list"></div>

  <div class="signature">
    <label for="nameInput">Quién hace el registro</label>
    <input id="nameInput" type="text" placeholder="Nombre y apellido">
  </div>

  <button class="save-btn" id="saveBtn">Guardar registro de hoy</button>

  <div class="history">
    <h2>Últimos registros de esta casa</h2>
    <div id="historyList"></div>
    <button class="export-btn" id="exportBtn">Exportar historial (JSON)</button>
  </div>

</div>

<script>
/* ---------- CONFIGURACIÓN: edita aquí los nombres de las casas y las tareas ---------- */
const HOUSES = [
  { id: "bac1", label: "Bacstation 1" },
  { id: "bac2", label: "Bacstation 2" },
  { id: "bac3", label: "Bacstation 3" }
];

const CHECKLISTS = {
  apertura: [
    "Recuento de personas presentes en la casa",
    "Revisión de incidencias del turno anterior",
    "Estado de nevera / despensa",
    "Medicación pendiente revisada (si aplica)",
    "Espacios comunes en orden",
    "Agenda / actividades del día revisadas"
  ],
  cierre: [
    "Incidencias del día registradas",
    "Actividades del día anotadas",
    "Espacios comunes recogidos",
    "Traspaso de información al próximo turno",
    "Puertas, ventanas y seguridad revisadas",
    "Material devuelto a su sitio"
  ]
};
/* -------------------------------------------------------------------------------------- */

const params = new URLSearchParams(location.search);
let currentHouse = params.get('casa') && HOUSES.some(h => h.id === params.get('casa'))
  ? params.get('casa')
  : (localStorage.getItem('bac_last_house') || HOUSES[0].id);
let currentTurno = 'apertura';

const todayKey = () => new Date().toISOString().slice(0,10);
const storageKey = (house, turno, date) => `bacchecklist_${house}_${turno}_${date}`;
const historyKey = (house) => `bacchecklist_history_${house}`;

function renderHousePicker(){
  const el = document.getElementById('housePicker');
  el.innerHTML = '';
  HOUSES.forEach(h => {
    const btn = document.createElement('button');
    btn.textContent = h.label.replace('Bacstation ', 'BS ');
    if(h.id === currentHouse) btn.classList.add('active');
    btn.onclick = () => { currentHouse = h.id; localStorage.setItem('bac_last_house', h.id); refreshAll(); };
    el.appendChild(btn);
  });
  const houseObj = HOUSES.find(h => h.id === currentHouse);
  document.getElementById('houseTitle').textContent = houseObj ? houseObj.label : 'Casa';
}

function renderDate(){
  const d = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  const str = d.toLocaleDateString('es-ES', opts);
  document.getElementById('dateLine').textContent = str.charAt(0).toUpperCase() + str.slice(1);
}

function getState(){
  const raw = localStorage.getItem(storageKey(currentHouse, currentTurno, todayKey()));
  if(raw) return JSON.parse(raw);
  return { items: CHECKLISTS[currentTurno].map(() => false), name: '' };
}

function saveState(state){
  localStorage.setItem(storageKey(currentHouse, currentTurno, todayKey()), JSON.stringify(state));
}

function renderList(){
  const state = getState();
  const list = document.getElementById('list');
  list.innerHTML = '';
  CHECKLISTS[currentTurno].forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'item' + (state.items[i] ? ' done' : '');
    row.innerHTML = `
      <div class="checkbox">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#182e28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="item-text">${text}</div>
    `;
    row.onclick = () => {
      const s = getState();
      s.items[i] = !s.items[i];
      saveState(s);
      renderList();
      renderProgress();
    };
    list.appendChild(row);
  });
  document.getElementById('nameInput').value = state.name || '';
}

function renderProgress(){
  const state = getState();
  const total = state.items.length;
  const done = state.items.filter(Boolean).length;
  document.getElementById('progressLabel').textContent = `${done}/${total}`;
  document.getElementById('progressFill').style.width = total ? `${(done/total)*100}%` : '0%';
}

function renderTurnoToggle(){
  document.querySelectorAll('#turnoToggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.turno === currentTurno);
  });
}

function renderHistory(){
  const raw = localStorage.getItem(historyKey(currentHouse));
  const hist = raw ? JSON.parse(raw) : [];
  const el = document.getElementById('historyList');
  el.innerHTML = '';
  if(hist.length === 0){
    el.innerHTML = '<p class="empty-note">Todavía no hay registros guardados para esta casa.</p>';
    return;
  }
  hist.slice(0,8).forEach(rec => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="h-left">
        <span class="h-turno">${rec.turno === 'apertura' ? 'Apertura' : 'Cierre'} · ${rec.date}</span>
        <span class="h-meta">${rec.name || 'Sin firmar'} · ${rec.time}</span>
      </div>
      <span class="h-pct">${rec.done}/${rec.total}</span>
    `;
    el.appendChild(div);
  });
}

document.getElementById('turnoToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-turno]');
  if(!btn) return;
  currentTurno = btn.dataset.turno;
  renderTurnoToggle();
  renderList();
  renderProgress();
});

document.getElementById('nameInput').addEventListener('input', (e) => {
  const s = getState();
  s.name = e.target.value;
  saveState(s);
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const state = getState();
  const total = state.items.length;
  const done = state.items.filter(Boolean).length;
  const raw = localStorage.getItem(historyKey(currentHouse));
  const hist = raw ? JSON.parse(raw) : [];
  hist.unshift({
    date: todayKey(),
    turno: currentTurno,
    name: state.name || '',
    done, total,
    time: new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' })
  });
  localStorage.setItem(historyKey(currentHouse), JSON.stringify(hist.slice(0,50)));
  renderHistory();
  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Registro guardado ✓';
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = 'Guardar registro de hoy'; btn.classList.remove('saved'); }, 1800);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const raw = localStorage.getItem(historyKey(currentHouse));
  const hist = raw ? JSON.parse(raw) : [];
  const blob = new Blob([JSON.stringify(hist, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historial_${currentHouse}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

function refreshAll(){
  renderHousePicker();
  renderDate();
  renderTurnoToggle();
  renderList();
  renderProgress();
  renderHistory();
}

refreshAll();
</script>
</body>
</html>
